specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: OptiSigns
providerId: optisigns
created: '2026-07-05'
modified: '2026-07-05'
reconciled: true
tags:
- Digital Signage
- Screens
- Content Management
- GraphQL
- Plans
description: >-
  OptiSigns prices its digital signage platform per screen per month, with
  discounts for annual billing. Plans progress from a free tier (up to 3 screens)
  through Standard, Pro, Pro Plus, Engage, and Enterprise. GraphQL API access is a
  paid capability included on the Pro Plus plan and higher (Pro Plus, Engage,
  Enterprise); Free, Standard, and Pro do not include API access. Enterprise
  requires a minimum of 25 screens. Per-screen pricing is not multiplied by API
  calls - the API is entitlement-gated by plan, and screens are the billable unit.
notes: >-
  Per-screen prices captured from the OptiSigns pricing page. Some third-party
  summaries describe API access as Enterprise-only; OptiSigns' own pricing page
  lists GraphQL API access from Pro Plus up. Verify the current entitlement for a
  given account on the pricing page during reconciliation.
sources:
- https://www.optisigns.com/pricing
- https://docs.optisigns.com/quickstart
- https://support.optisigns.com/hc/en-us/sections/4414558217235-OptiSigns-API
