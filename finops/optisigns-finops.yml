  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: OptiSigns
serviceCategory: Digital Signage
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
meters:
- name: active_screens
  description: Screens (devices) active on the account, billed per screen per month by plan tier.
  unit: screens
  aggregation: sum
  dimensions:
  - account
  - plan
  - team
- name: plan_tier
  description: Plan tier attached to screens; determines per-screen price and whether GraphQL API access is included.
  unit: tier
  aggregation: max
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track active screen count and plan tier per team/location; the screen is the unit that drives cost.
- name: Allocation
  description: Use OptiSigns Teams (sub-accounts) to map screens to internal cost centers and locations.
- name: Optimization
  description: Right-size each screen to the lowest plan that carries required features; only put screens that truly need programmatic control on Pro Plus or higher; take annual-billing discounts; retire idle/unpaired screens.
- name: Accountability
  description: Assign owners per team; review active-screen counts and plan mix monthly against budget.
