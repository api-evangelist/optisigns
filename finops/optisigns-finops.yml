- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of OptiSigns spend. OptiSigns bills per screen per month (or per
  screen per month billed annually), not per API call. The billable unit is the
  active screen; the GraphQL API is an entitlement unlocked by plan (Pro Plus and
  higher) rather than a metered, usage-priced service. Cost scales with the number
  of screens deployed and the plan tier attached to them. Optimization is about
  right-sizing plan tier per screen, consolidating screens onto the lowest tier
  that still carries required features (API access requires Pro Plus or higher),
  and taking annual billing discounts.
notes: >-
  Per-screen prices captured from the OptiSigns pricing page; verify current
  rates and API entitlement during reconciliation. There is no per-API-call charge
  documented - API usage is included with qualifying plans.
sources:
- https://www.optisigns.com/pricing
