aid: optisigns
url: https://raw.githubusercontent.com/api-evangelist/optisigns/refs/heads/main/apis.yml
name: OptiSigns
kind: company
description: OptiSigns is a cloud digital signage platform that turns any TV or
  display into a digital sign using low-cost media players (Android, Amazon Fire
  TV, Raspberry Pi, ProDVX, and others). Screens, media assets, playlists, and
  schedules are managed centrally from the OptiSigns dashboard. Developers manage
  the same resources programmatically through the OptiSigns GraphQL API, which is
  served from a single endpoint at https://graphql-gateway.optisigns.com/graphql
  and authenticated with a Bearer API key. API access is a paid capability
  available on the Pro Plus plan and higher; the API covers devices (screens),
  assets (content), playlists, schedules, and team management. Official
  TypeScript/JavaScript and Python SDKs plus an API cookbook are published on
  GitHub.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Digital Signage
- Screens
- Content Management
- GraphQL
- Displays
- Playlists
