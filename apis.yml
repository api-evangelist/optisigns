  name: OptiSigns Devices API
  tags:
  - Devices
  - Screens
  - Displays
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.optisigns.com/quickstart
