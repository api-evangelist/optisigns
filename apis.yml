    type: SourceCode
  - url: graphql/optisigns-schema.graphql
    type: GraphQL
  - url: collections/optisigns.opencollection.json
    type: PostmanCollection
  description: Manage the content assets displayed on screens - upload file assets
    (images, video, documents), create website and app assets, modify asset
    settings, list and fetch assets by filename, and delete assets. Confirmed
    against the official OptiSigns Node SDK methods uploadFileAsset,
    createWebsiteAppAsset, modifyAssetSettings, and deleteAssetById.
