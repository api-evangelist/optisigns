    type: GraphQL
  - url: graphql/optisigns-graphql.md
    type: Documentation
  - url: collections/optisigns.opencollection.json
    type: PostmanCollection
  description: Query and manage the devices (screens) paired to an OptiSigns
    account. List devices, look them up by name or ID, create and update device
    settings, reboot a device, push content, and delete devices. Confirmed against
    the official OptiSigns Node SDK methods listAllDevices, findByDeviceName,
    getDeviceById, createDevice, updateDevice, deleteDeviceById, rebootDevice, and
    pushContentToDevice.
- aid: optisigns:optisigns-assets-api
